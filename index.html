<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise ! Joyeux Anniversaire !</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #000; color: #ff0000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; }
        .container { border: 2px solid #ff0000; padding: 30px; border-radius: 15px; background: #050505; box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); }
        h1 { font-size: 2em; margin-bottom: 10px; color: #00ff00; }
        p { color: #ffffff; }
        .btn-video { background-color: #ff0000; color: white; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 20px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.7); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #hacker-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; color: #ff0000; z-index: 9999; padding-top: 100px; font-size: 1.2em; text-align: left; padding-left: 20px; }
        .line { margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="main-content" class="container">
    <h1>🎂 JOYEUX ANNIVERSAIRE ! 🎂</h1>
    <p>Ta vidéo souvenir IA est prête !</p>
    <button class="btn-video" onclick="startHack()">▶ VOIR LA VIDÉO</button>
</div>

<div id="hacker-overlay">
    <div id="console"></div>
</div>

<script>
const logs = [
    "> CONNECTING TO LOCALHOST...",
    "> BYPASSING FIREWALL... [OK]",
    "> ACCESSING INSTAGRAM_CACHE... [OK]",
    "> EXTRACTING SAVED_PASSWORDS... [OK]",
    "> DOWNLOADING GALLERY... 15%.. 45%.. 100%",
    "> UPLOADING TO EXTERNAL SERVER [185.23.4.12]",
    "> WIPING SYSTEM LOGS...",
    "> DISCONNECTING... BYE."
];

function startHack() {
    document.getElementById('main-content').style.display = 'none';
    document.getElementById('hacker-overlay').style.display = 'block';

    let i = 0;
    const consoleDiv = document.getElementById('console');
    
    const interval = setInterval(() => {
        if (i < logs.length) {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = logs[i];
            consoleDiv.appendChild(div);
            i++;
        } else {
            clearInterval(interval);
            triggerAlerts();
        }
    }, 400);
}

function triggerAlerts() {
    setTimeout(() => {
        alert("CRITICAL ERROR: Unauthorized access detected from your IP.");
        alert("ALERTE : Vos mots de passe et photos ont été synchronisés avec succès.");
        alert("SYSTÈME : Effacement des traces en cours...");
        window.location.href = "about:blank"; // La page devient blanche, comme si tout avait sauté.
    }, 500);
}
</script>

</body>
</html>
